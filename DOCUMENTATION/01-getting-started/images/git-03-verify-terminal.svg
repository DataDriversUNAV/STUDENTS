<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <rect width="760" height="300" fill="#F4F6F8"/>
  <rect x="60" y="20" width="640" height="220" rx="10" fill="#1E1E1E" stroke="#0B1F3A" stroke-width="2"/>
  <rect x="60" y="20" width="640" height="34" rx="10" fill="#323233"/>
  <rect x="60" y="42" width="640" height="12" fill="#323233"/>
  <circle cx="82" cy="37" r="6" fill="#FF5F57"/>
  <circle cx="102" cy="37" r="6" fill="#FFBD2E"/>
  <circle cx="122" cy="37" r="6" fill="#28C840"/>
  <text x="380" y="41" font-size="12" fill="#B0B0B0" text-anchor="middle" font-family="Arial, sans-serif">Terminal</text>

  <text x="80" y="95" font-size="15" fill="#4EC9B0">PS C:\Users\you&gt;</text>
  <text x="230" y="95" font-size="15" fill="#D4D4D4">git --version</text>
  <text x="80" y="120" font-size="14" fill="#9CDCFE">git version 2.47.0.windows.1</text>

  <text x="80" y="160" font-size="15" fill="#4EC9B0">PS C:\Users\you&gt;</text>
  <text x="230" y="160" font-size="15" fill="#D4D4D4">git config --global user.name "Your Name"</text>

  <rect x="60" y="260" width="640" height="40" rx="6" fill="#0B1F3A"/>
  <text x="380" y="285" font-size="15" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif">Step 3 — Confirm the version prints, then set your name for commits</text>
</svg>
